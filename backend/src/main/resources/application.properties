# ════════════════════════════════════════════════════════════════
#  TransitOps Backend — application.properties
# ════════════════════════════════════════════════════════════════

# ─── Server ───
server.port=8080

# ─── Supabase PostgreSQL ───
# Replace with your Supabase project connection string.
# Pooler: postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/transitops}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ─── JWT ───
# 256-bit secret — override via env var JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:transitops_super_secret_jwt_key_change_in_production_2026}
# 24 hours in milliseconds
app.jwt.expiration=86400000

# ─── CORS ───
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ─── SpringDoc OpenAPI / Swagger ───
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ─── Logging ───
logging.level.com.transitops=INFO
logging.level.org.springframework.security=INFO
