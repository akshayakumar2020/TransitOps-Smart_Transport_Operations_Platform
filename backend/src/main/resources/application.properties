# ─── Server Configuration ───
server.port=8081

# ─── MySQL Database Configuration ───
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/transitops?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=Akanksha@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate Settings ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ─── JWT Security ───
app.jwt.secret=${JWT_SECRET:transitops_super_secret_jwt_key_change_in_production_2026}
app.jwt.expiration=86400000

# ─── CORS Configuration ───
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ─── SpringDoc OpenAPI / Swagger ───
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ─── Logging ───
logging.level.com.transitops=INFO
logging.level.org.springframework.security=INFO